<div class="header" *ngIf="!isLoading">
  <a routerLink="/admin/people">
    <i class="material-icons">arrow_back</i>
    Celebrity List
  </a>
  <span>/</span>
  <h1 class="header__title">Edit Celebrity: {{ personData?.name }}</h1>
</div>

<div *ngIf="isLoading" class="loading-container">
  <app-loading [isOverlay]="true"></app-loading>
</div>

<app-person-form
  *ngIf="!isLoading && personData"
  [personData]="personData"
  [isEditMode]="true"
>
</app-person-form>
