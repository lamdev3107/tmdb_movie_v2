<div
  class="hero-section"
  [style.background-image]="
    'linear-gradient(to bottom, rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), url(' +
    movie?.backdropPath +
    ')'
  "
  [style.background-repeat]="'no-repeat'"
  [style.background-position]="'center'"
  [style.background-size]="'cover'"
>
  <div class="hero-section__container">
    <div class="hero-section__poster" *ngIf="movie?.posterPath">
      <img
        class="hero-section__poster-image"
        [src]="
          movie?.posterPath ? movie?.posterPath : 'assets/images/no-picture.png'
        "
        [alt]="movie?.title"
        loading="lazy"
      />
    </div>
    <div
      class="hero-section__poster hero-section__poster--no-image"
      *ngIf="!movie?.posterPath"
    >
      <img
        class="hero-section__poster-image--no-image"
        src="assets/icons/picture.svg"
        alt="No poster"
        class="hero-section__poster-image--no-image"
        loading="lazy"
      />
    </div>
    <div class="hero-section__content">
      <div class="hero-section__info">
        <h1 class="hero-section__info-title">
          {{ movie?.title || "-------" }}
          <span class="hero-section__info-year"
            >({{ movie?.releaseDate | date : "yyyy" }})</span
          >
        </h1>
        <div class="hero-section__meta">
          <span class="hero-section__meta-age">{{ age }}</span>
          <span> </span>
          <span class="hero-section__meta-date">{{
            movie?.releaseDate | date : "dd/MM/yyyy"
          }}</span>
          <span class="hero-section__meta-genre">{{ genres }}</span>
          <span class="hero-section__meta-duration">{{
            movie?.runtime | formatTime
          }}</span>
        </div>
      </div>

      <div class="hero-section__user-score">
        <app-user-score
          [size]="'medium'"
          [score]="movie?.voteAverage"
        ></app-user-score>
        <span class="hero-section__user-score-label">User Score</span>
        <ng-container>
          <button
            class="hero-section__user-score-button"
            (click)="openRating()"
          >
            {{
              accountStates?.isRated
                ? "Your Rating: " + accountStates?.ratingScore + "%"
                : "Rate This Movie"
            }}
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="size-6"
            >
              <path
                fill-rule="evenodd"
                d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
                clip-rule="evenodd"
              />
            </svg>
          </button>
        </ng-container>
      </div>

      <div class="hero-section__actions">
        <app-button
          variant="primary"
          size="large"
          [disabled]="disablePlayTrailer"
          (click)="onPlayTrailer()"
        >
          <img
            class="btn-icon"
            src="assets/icons/play.svg"
            alt="play"
            loading="lazy"
          />
          Play Trailer
        </app-button>

        <app-tooltip
          [text]="
            accountStates?.inFavourite
              ? 'Remove from favorite list'
              : 'Mark as favorite'
          "
          [position]="'top'"
        >
          <app-button
            variant="icon"
            size="medium"
            (click)="handleToggleLikeBtn()"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="white"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              class="action-btn-icon"
              stroke="currentColor"
              [class.action-btn-icon--is-favorite]="accountStates?.inFavourite"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"
              />
            </svg>
          </app-button>
        </app-tooltip>

        <!-- <app-tooltip
          [text]="
            accountStates?.inUserList
              ? 'Remove from watchlist'
              : 'Add to watchlist'
          "
          [position]="'top'"
        >
          <app-button variant="icon" size="medium" (click)="openListModal()">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="currentColor"
              class="action-btn-icon"
              [class.action-btn-icon--is-watchlist]="accountStates?.inUserList"
            >
              <path
                fill-rule="evenodd"
                d="M6.32 2.577a49.255 49.255 0 0 1 11.36 0c1.497.174 2.57 1.46 2.57 2.93V21a.75.75 0 0 1-1.085.67L12 18.089l-7.165 3.583A.75.75 0 0 1 3.75 21V5.507c0-1.47 1.073-2.756 2.57-2.93Z"
                clip-rule="evenodd"
              />
            </svg>
          </app-button>
        </app-tooltip> -->
      </div>

      <p class="hero-section__tagline">
        {{ movie?.tagline }}
      </p>

      <div class="hero-section__overview">
        <h2 class="hero-section__overview-text">Overview</h2>
        <p class="hero-section__overview-content">
          {{ movie?.overview }}
        </p>
      </div>
    </div>
  </div>
</div>

<app-trailer-modal
  [openModal]="openTrailerModal"
  (closeEvent)="onCloseTrailerModal()"
  [movie]="movie"
></app-trailer-modal>
